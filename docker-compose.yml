services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: landtag
      POSTGRES_PASSWORD: landtag
      POSTGRES_DB: landtag_sim
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landtag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Hinweis: Docker-Build-Kontext fuer ../sim funktioniert nur, wenn dieser
  # Service mit Kontext auf Repo-Root gebaut wird (siehe README "Lokal starten").
  # Fuer taegliche Entwicklung ist `uvicorn` direkt auf dem Host meist schneller
  # (Hot-Reload) -- dieser Service ist optional fuer einen "docker-compose up"-
  # Rundumschlag ohne lokale Python-Installation.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://landtag:landtag@db:5432/landtag_sim
      # Muss exakt der URL entsprechen, unter der das Frontend im Browser
      # laeuft (CORS, backend/app/main.py). Fuer Zugriff vom Handy im LAN in
      # der .env im Repo-Root auf die Host-LAN-IP setzen (siehe .env.example).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8000:8000"

  # B11 (BACKLOG.md): Frontend-Service fuer einen "docker compose up"-
  # Rundumschlag und fuers Testen vom Handy im lokalen Netz. Fuer taegliche
  # Entwicklung bleibt `npm run dev` auf dem Host schneller (HMR) -- dieser
  # Service serviert den statischen Vite-Build per `vite preview`.
  frontend:
    build:
      context: ./frontend
      args:
        # BUILD-Zeit: wird ins Bundle eingebacken. Default fuer Zugriff vom
        # selben Rechner; fuers Handy die Host-LAN-IP via .env uebergeben.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
